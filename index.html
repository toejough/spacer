<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1a73e8">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Flashcard App</h1>
        <form id="flashcard-form">
            <input type="text" id="question" placeholder="Enter question" required>
            <input type="text" id="answer" placeholder="Enter answer" required>
            <button type="submit" class="add-btn">Add Flashcard</button>
        </form>
        <div id="flashcards-list"></div>
    </div>
    <script src="script.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('service-worker.js');
        });
      }
    </script>
</body>
</html>
