schema: spec-driven

context: |
  Tech stack: Go 1.22+ HTTP server (cmd/srv, srv), SQLite with sqlc (db/),
  HTML/JS/CSS single-page app (srv/templates, srv/static).
  The app is a personal todo/notes app with spaced repetition (SM-2 algorithm),
  code-named "Remember Everything". Items are stored in browser localStorage,
  but the server opens a SQLite database for the template.
  A separate Quasar/Vue PWA prototype lives under web-app/ but is not currently active.

  Coding conventions:
  - Go: standard formatting, explicit error handling, use slog for logging.
  - Database migrations in db/migrations/, queries in db/queries/, models generated by sqlc.
  - Frontend: vanilla JS in srv/static/script.js, CSS in srv/static/style.css.
  - Tests: Go tests in *_test.go files, mutation testing helpers under dev/.
  - Build: `make build` produces `todo-srv`; `make test` runs Go tests.
  - Deployment: run as systemd service via srv.service.
